<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pago en Mostrador</title>
  <script src="https://cdn.tailwindcss.com"></script>
   <link rel="icon" href="/dist/imgs/logo.ico" type="image/x-icon">
</head>
<body class="bg-black min-h-screen flex items-center justify-center">
  <div class="bg-white rounded-xl shadow-lg p-8 max-w-md text-center">
    <h1 class="text-2xl font-bold mb-4">Mesa #</h1>
    <p class="text-lg mb-4">El total a pagar es de: <span class="font-semibold"></span></p>
    <p class="text-sm text-gray-700 mb-6">Por favor acercarse al mostrador para pagar</p>
    <img src="/dist/imgs/iconoPago.png" alt="Imagen pago" class="mx-auto w-24 h-24 object-contain" />
  </div>
  <form id="autoForm" action="/auth/pantallaFinal" method="POST" style="display:none;">
    <input type="hidden" name="mesa" value="5">
    <input type="hidden" name="estado" value="finalizado">
  </form>

  <script>
    window.addEventListener("load", () => {
      setTimeout(() => {
        document.getElementById("autoForm").submit();
      }, 5000); // 5 segundos
    });
  </script>
</body>
</html>
