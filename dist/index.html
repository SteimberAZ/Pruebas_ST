<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="/dist/imgs/style.css" rel="stylesheet">
</head>
<body style="background: linear-gradient(10deg, #d3a3fe, #ade8f8);" class="overflow-hidden p-4 sm:flex-row  min-h-screen  flex  
flex-col items-center justify-center min-w-screen ">
  <div class=" flex flex-col items-center-safe justify-center  
  w-[300px] sm:w-[350px] md:w-[400px] lg:w-[450px] h-auto  shadow-blue-50 transition-all duration-50 ease-out animate-pulse">
    <img src="/dist/imgs/completo.png" class=" h-auto w-[300px] sm:w-[350px] md:w-[400px] lg:w-[450px]">
  </div>
  <div class="  bg-white p-4 rounded-2xl flex flex-col items-center justify-center 
  w-80 sm:w-[300px] md:w-[400px] lg:w-[400px] h-100">

    <form class=" flex flex-col items-center justify-center 
    " action="/auth/login" method="post">

      <label for="user">Usuario</label><br>
      <input  class="p-2 focus:outline-none border-black border-1 rounded-[5px] hover:bg-gray-100 focus:border-blue-400
      w-70" type="text" id="user" name="user" required placeholder="..."><br><br>

      <label for="contrasena">Contraseña</label><br>
      <input class="p-2 border-black border-1 outline-0 rounded-[5px] hover:bg-gray-100 justify-center items-center
       focus:border-blue-400 w-70" type="password" id="contrasena" name="contrasena" required placeholder="..."><br><br>
      <button class="px-4 py-2 bg-blue-400  rounded hover:bg-blue-800 transition" type="submit">
       <a class="text-white"> Iniciar Sesión perraaa</a>
      </button>
    </form>

    
  </div>


</body>
</html>
